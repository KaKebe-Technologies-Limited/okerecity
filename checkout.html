<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Checkout — Okere Shea</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="site-header"></div>
<main>
<div style="height:68px"></div>
<section class="section" style="padding-top:48px">
  <div class="container">
    <h1 style="margin-bottom:32px">Checkout</h1>
    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:40px;align-items:start">
      <div style="background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:36px">
        <h3 style="font-family:'Inter',sans-serif;font-size:1rem;font-weight:700;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--sand)">Shipping Information</h3>
        <form id="checkoutForm">
          <div class="form-group"><label>Full Name</label><input type="text" id="fullName" required placeholder="Jane Smith"/></div>
          <div class="form-group"><label>Email Address</label><input type="email" id="email" required placeholder="jane@example.com"/></div>
          <div class="form-group"><label>Shipping Address</label><input type="text" id="address" required placeholder="123 Main Street"/></div>
          <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" id="city" required/></div>
            <div class="form-group"><label>Postal Code</label><input type="text" id="postal"/></div>
          </div>
          <div class="form-group"><label>Country</label>
            <select id="country" required>
              <option value="">Select Country</option>
              <option>Uganda</option><option>United States</option><option>United Kingdom</option>
              <option>Germany</option><option>France</option><option>Australia</option><option>Other</option>
            </select>
          </div>
          <div class="form-group" style="margin-top:8px">
            <label>Payment Method</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
              <button type="button" onclick="selectPayment(this,'card')" style="padding:10px 16px;border:1.5px solid var(--sand);border-radius:6px;background:var(--white);font-size:.82rem;font-weight:500;cursor:pointer;transition:.25s">Credit Card</button>
              <button type="button" onclick="selectPayment(this,'paypal')" style="padding:10px 16px;border:1.5px solid var(--sand);border-radius:6px;background:var(--white);font-size:.82rem;font-weight:500;cursor:pointer;transition:.25s">PayPal</button>
              <button type="button" onclick="selectPayment(this,'mobilemoney')" style="padding:10px 16px;border:1.5px solid var(--sand);border-radius:6px;background:var(--white);font-size:.82rem;font-weight:500;cursor:pointer;transition:.25s">Mobile Money</button>
              <button type="button" onclick="selectPayment(this,'flutterwave')" style="padding:10px 16px;border:1.5px solid var(--sand);border-radius:6px;background:var(--white);font-size:.82rem;font-weight:500;cursor:pointer;transition:.25s">Flutterwave</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px">Place Order</button>
        </form>
      </div>
      <div class="order-panel">
        <h3>Order Summary</h3>
        <div id="orderItems"></div>
        <div class="order-total-row"><span>Total</span><span id="orderTotal" style="color:var(--gold)">$0.00</span></div>
        <div class="order-note">Your purchase supports the Okere community in Northern Uganda.</div>
      </div>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
<script>
function selectPayment(btn, method) {
  document.querySelectorAll('[onclick^="selectPayment"]').forEach(b => {
    b.style.background='var(--white)'; b.style.borderColor='var(--sand)'; b.style.color='inherit';
  });
  btn.style.background='var(--green)'; btn.style.borderColor='var(--green)'; btn.style.color='#fff';
}
</script>
</body></html>
