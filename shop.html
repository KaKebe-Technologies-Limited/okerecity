<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — Okere Shea Collection</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="header"></div>

    <main>
        <section class="page-hero shop-hero">
            <div class="container">
                <h1>Our Shea Collection</h1>
                <p>Each jar carries the story of Okere — from our community to you.</p>
            </div>
        </section>

        <section class="shop-section">
            <div class="container">
                <div class="shop-toolbar">
                    <div class="filter-buttons" id="filterButtons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="butter">Shea Butter</button>
                        <button class="filter-btn" data-filter="oil">Shea Oil</button>
                        <button class="filter-btn" data-filter="body">Body Care</button>
                        <button class="filter-btn" data-filter="bulk">Bulk / Wholesale</button>
                    </div>
                    <div class="shop-sort">
                        <label for="sortSelect">Sort by:</label>
                        <select id="sortSelect">
                            <option value="featured">Featured</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="name">Name</option>
                        </select>
                    </div>
                </div>

                <div id="productGrid" class="product-grid">
                    <!-- Rendered by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/main.js"></script>
    <script src="js/shop.js"></script>
</body>
</html>
